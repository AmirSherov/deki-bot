services:
  deki-bot:
    build: .
    env_file:
      - .env
    environment:
      WEBAPP_HOST: "0.0.0.0"
      WEBAPP_PORT: "5555"
    restart: unless-stopped
    ports:
      - "127.0.0.1:5555:5555"
    networks:
      - default
      - shared

networks:
  shared:
    name: ${SHARED_NETWORK:-deki-shared}
    external: true
